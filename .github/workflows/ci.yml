name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: WIL_Afcon/WIL_Afcon.slnx
  WEB_DIR: WIL_Afcon/WIL_Afcon

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Front-end (Tailwind + daisyUI) ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json

      - name: Install npm packages
        working-directory: ${{ env.WEB_DIR }}
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: ${{ env.WEB_DIR }}
        run: npx @tailwindcss/cli -i ./wwwroot/css/input.css -o ./wwwroot/css/output.css --minify

      # ---- .NET ----
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      # Runs any test projects in the solution (need to add one or a few)
      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build --verbosity normal

      # ---- Package build output so it can be downloaded from the run page ----
      - name: Publish web app
        run: dotnet publish WIL_Afcon/WIL_Afcon/WIL_Afcon.csproj -c Release --no-build -o publish/web

      - name: Publish API
        run: dotnet publish WIL_Afcon/WIL_Afcon.API/WIL_Afcon.API.csproj -c Release --no-build -o publish/api

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: wil-afcon-web
          path: publish/web
          retention-days: 7

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: wil-afcon-api
          path: publish/api
          retention-days: 7