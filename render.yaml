# Render Blueprint: hosts the web app and the API as two Docker web services.
# Database is MongoDB Atlas (external). Secrets marked "sync: false" are
# entered in the Render dashboard and never committed.
# Deploys are triggered by GitHub Actions (deploy hooks) after tests pass,
# so autoDeploy is off.

services:
  # ---------------- REST API + SignalR hub + Hikvision webhook ----------------
  - type: web
    name: wil-afcon-api
    runtime: docker
    region: frankfurt
    plan: free            # paid plan: stays awake for device scans and SignalR
    branch: main
    dockerContext: ./WIL_Afcon
    dockerfilePath: ./WIL_Afcon/WIL_Afcon.API/Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: PORT
        value: "8080"
      - key: MongoDbSettings__ConnectionString
        sync: false
      - key: MongoDbSettings__DatabaseName
        value: Afcon_Attendance_DB
      - key: ApiSecurity__ApiKey
        generateValue: true
      - key: HikvisionDevice__InboundToken
        generateValue: true
      - key: Cors__AllowedOrigins__0
        value: https://wil-afcon-web.onrender.com

  # ---------------- MVC web app (admin + employee portal) ----------------
  - type: web
    name: wil-afcon-web
    runtime: docker
    region: frankfurt
    plan: free               # upgrade to starter for presentation / EXPO weeks
    branch: main
    dockerContext: ./WIL_Afcon
    dockerfilePath: ./WIL_Afcon/WIL_Afcon/Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: PORT
        value: "8080"
      - key: MongoDbSettings__ConnectionString
        sync: false
      - key: MongoDbSettings__DatabaseName
        value: Afcon_Attendance_DB
      - key: ApiSettings__BaseUrl
        value: https://wil-afcon-api.onrender.com/
      - key: ApiSettings__PublicUrl
        value: https://wil-afcon-api.onrender.com/
      - key: ApiSettings__ApiKey
        fromService:
          type: web
          name: wil-afcon-api
          envVarKey: ApiSecurity__ApiKey
      - key: SeedAccounts__AdminEmail
        sync: false
      - key: SeedAccounts__AdminPassword
        sync: false
      - key: SeedAccounts__EmployeeEmail
        sync: false
      - key: SeedAccounts__EmployeePassword
        sync: false
